name: CI

on:
  push:
    branches: [master, v2, "codex/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Build library
        run: npm run build:lib

      - name: Verify packed package and consumer
        run: npm run test:consumer

      - name: Verify patch whitespace
        run: git diff --check
