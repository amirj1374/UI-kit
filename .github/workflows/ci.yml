name: CI

on:
  push:
    branches: [master, v2, "codex/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Type check
        run: bun run typecheck

      - name: Unit and component tests
        run: bun run test

      - name: Coverage
        run: bun run test:coverage

      - name: Build library
        run: bun run build:lib

      - name: Verify packed package and consumer
        run: bun run test:consumer

      - name: Verify patch whitespace
        run: git diff --check
